name: "python-s3"
description: "Writes to S3"
setup:
  - type: "s3/create-bucket"
    params:
      bucket: "orders"

cases:
  - name: "store-message"
    payload:
      bucket: "orders"
      key: "o-123.json"
      message: "order placed"
    expected:
      statusCode: 200
      body:
        ok: true
        bucket: "orders"
        key: "o-123.json"
    side_effects:
      - type: "s3/object-exists"
        params:
          bucket: "orders"
          key: "o-123.json"
      - type: "s3/object-contains"
        params:
          bucket: "orders"
          key: "o-123.json"
          contains: "order placed"
