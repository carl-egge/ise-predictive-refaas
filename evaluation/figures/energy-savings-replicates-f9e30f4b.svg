<text x="80" y="706" font-size="11" fill="#444">test p = 2e-06). non-AWS: median -0.013 J, 12/26 positive (p = 0.85). AWS vs non-AWS: Mann-Whitney p = 3e-07. Per run, the AWS</text>
<text x="80" y="721" font-size="11" fill="#444">median is 21.7, 28.0 and 57.6 J.</text>
