# Deliberately short dev pipeline for quick functional tests (the canonical
# evaluation pipeline is default.json at the repo root). Unlike the previous
# version - which had goTester as the builder's validation, so a test failure
# rebuilt identical code with no LLM repair ever running - test failures here
# get exactly one realign+rebuild repair attempt, keeping runs cheap but not
# pointless.
options:
  model_name: "qwen2.5-coder:3b"

tasks:
  # Deterministic Python analysis ([C8]/[I3]): no LLM call, no tokens. Runs
  # first so every later prompt can reference {{ .lib_hints }} and
  # {{ .py_features }}, and so the job records its feature vector.
  - id: "root"
    task: "pyScan"
    maxRetryCount: 1
    next:
      - "clean"
  - id: "clean"
    task: "cleaner"
    maxRetryCount: 1
    retryDelay: "5s"
    next:
      - "convert"
  - id: "convert"
    task: "coder"
    task_args:
      reader: go
    maxRetryCount: 2
    retryDelay: "3s"
    next:
      - "builder"
  - id: "builder"
    task: "goBuilder"
    recovery: "gollmRecovery"
    retryDelay: "5s"
    maxRetryCount: 3
    next:
      - "tester"
  - id: "tester"
    task: "testRouter"
    canApply: "canCompile"
    maxRetryCount: 2
    recovery: "testRecovery"
  - id: "gollmRecovery"
    task: "fixer"
    task_args:
      reader: go
    maxRetryCount: 2
  - id: "testRecovery"
    task: "realign"
    task_args:
      reader: go
    maxRetryCount: 1
    next:
      - "recoveryBuild"
  - id: "recoveryBuild"
    task: "goBuilder"
    recovery: "gollmRecovery"
    maxRetryCount: 2
