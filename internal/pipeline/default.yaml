options:
  model_name: "gemma4:31b-cloud"
  strategy: "json"
  floci_enabled: false
  floci_endpoint: "http://localhost:4566"
  floci_region: "us-east-1"
  floci_account_id: "000000000000"
  floci_function_name: "refaas-translated"
  floci_lambda_timeout_seconds: 10
  floci_lambda_memory_mb: 128
  floci_test_prefix: "test/floci/"
  floci_test_suffixes:
    - ".floci.json"
    - ".floci.yaml"
    - ".floci.yml"

tasks:
  - id: "root"
    task: "cleaner"
    maxRetryCount: 1
    retryDelay: "5s"
    next:
      - "convert"
  - id: "convert"
    task: "coder"
    task_args:
      reader: go
    maxRetryCount: 2
    retryDelay: "3s"
    next:
      - "builder"
  - id: "builder"
    task: "goBuilder"
    recovery: "gollmRecovery"
    retryDelay: "5s"
    maxRetryCount: 3
    validation: "goTester"
    next:
      - "flociTester"
  - id: "flociTester"
    task: "flociTester"
    maxRetryCount: 1
  - id: "gollmRecovery"
    task: "fixer"
    task_args:
      reader: go
    maxRetryCount: 2
