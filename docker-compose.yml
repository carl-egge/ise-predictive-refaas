services:
  refaas:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - OLLAMA_API_URL=${OLLAMA_API_URL}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL}
    volumes:
      - ./chatlogs:/app/chatlogs
      - ./data:/app/data
    depends_on:
      - ollama
    networks:
      - refaas
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      # Ollama runs its own defaults; no extra env vars required here.
      - OLLAMA_ALLOW_NETWORK=false
    networks:
      - refaas
    restart: unless-stopped

  floci:
    image: hectorvent/floci:latest
    profiles:
      - floci
    ports:
      - "4566:4566"
    user: "0:0"
    environment:
      - FLOCI_SERVICES_LAMBDA_DOCKER_NETWORK=refaas
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/floci:/app/data
    networks:
      - refaas
    restart: unless-stopped

volumes:
  ollama_data:

networks:
  refaas:
    name: refaas